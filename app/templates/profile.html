{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>My profile</h2>
  <p>{{ user.name }} · {{ user.email }}</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label>Phone <input class="full" name="phone" value="{{ user.phone }}"></label>
    <label>Delivery address <input class="full" name="address" value="{{ user.address }}"></label>
    <button type="submit">Save</button>
  </form>
</div>
<div class="card">
  <h3>Change password</h3>
  <form method="post" action="{{ url_for('change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label>Current password <input class="full" name="current_password" type="password" autocomplete="current-password"></label>
    <label>New password <input class="full" name="new_password" type="password" autocomplete="new-password"></label>
    <button type="submit">Change password</button>
  </form>
</div>
{% endblock %}
